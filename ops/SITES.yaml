# ops/SITES.yaml — fleet SITE REGISTRY (WO-7).
# A site is an externally managed deployment target fleet can observe
# (WO-7: read-only) and later operate (WO-8+). `access` is EXPLICIT per
# site — fleet never resolves cluster credentials from the ambient
# environment (AGENTS.md rule 7):
#   access: in-cluster          -> the pod serviceaccount of the site itself
#   access: kubeconfig:<path>   -> absolute or lab_root-relative kubeconfig
sites_version: 1

sites:

  - name: hk-03-dev
    engine: fleet
    lab_root: ops/sites/hk-03-dev
    namespace: sos-lab
    access: in-cluster
    secrets_dir: ../sos-lab/secrets
    description: fleet-managed site (migrated 2026-08-28T01:14:56Z)
