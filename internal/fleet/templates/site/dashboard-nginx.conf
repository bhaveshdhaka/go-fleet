server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 404;
    }

    location = /@SLUG@ {
        return 301 /@SLUG@/;
    }

    location = /@SLUG@/ {
        alias /usr/share/nginx/html/;
        try_files /index.html =404;
    }

    location / {
        return 404;
    }
}
