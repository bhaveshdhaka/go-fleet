cloudflare:
  account_id: acct123
  tunnel_id: tun123
  tunnel_name: lab
domains:
  example.test:
    zone_id: zone123
projects:
  sos-lab:
    repo: .
    principles:
      text: "keep it boring"
      tags: [a, b]
      nested:
        deep: true
services:
  alpha:
    image: reg.local:5000/alpha:v1
    host: alpha.example.test
    port: 8080
    namespace: sos-lab
    enabled: true
    env:
      BASE_URL: https://alpha.example.test
      DATABASE_URI: sqlite://./data/db.sqlite
    secrets:
      - ALPHA_KEY
    storage:
      size: 5Gi
      mount: /app/data
    probePath: /healthz
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 3Gi
  beta:
    repo: beta-src
    port: 80
    namespace: sos-lab
    enabled: false
    secrets: []
    args: ["--port", "80"]
    runAsUser: 1000
  gamma:
    image: busybox:1.36
    port: 8000
    namespace: other-ns
    enabled: true
    mounts:
    - path: /cfg
      host: /etc/rancher/k3s/k3s.yaml
      readOnly: true
    - path: /data/sub
      sub: inner
    serviceAccount: gamma-sa
